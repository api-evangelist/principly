name: Principly
description: >-
  Principly, Inc. is an SEC-registered investment adviser that operates the
  consumer fintech product Backer (backer.com), a mobile-first platform for
  opening and managing 529 education savings plans. Backer lets parents open a
  529 plan in minutes, automate contributions, and share custom gifting links so
  family and friends can contribute to a child's college fund. The service helps
  families choose among more than 100 U.S. 529 plans, reporting 250K+ users and
  $70M+ saved. It is a consumer-facing mobile and web application and does not
  publish a public developer API, documentation, or SDKs. Principly is backed by
  500 Global and was added to the API Evangelist network as a portfolio company.
